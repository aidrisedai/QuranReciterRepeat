apply plugin: 'com.android.application'
apply plugin: 'com.google.dagger.hilt.android'

android {
    namespace 'com.repeatquran'
    compileSdkVersion 35

    defaultConfig {
        applicationId 'com.repeatquran'
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 7
        versionName '1.3.0'
        
        // Load Gemini API key from local.properties
        Properties properties = new Properties()
        if (rootProject.file('local.properties').exists()) {
            properties.load(rootProject.file('local.properties').newDataInputStream())
        }
        def geminiKey = properties.getProperty('GEMINI_API_KEY', '')
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""
        
        def elevenLabsKey = properties.getProperty('ELEVENLABS_API_KEY', '')
        buildConfigField "String", "ELEVENLABS_API_KEY", "\"${elevenLabsKey}\""
        
        def openAiKey = properties.getProperty('OPENAI_API_KEY', '')
        buildConfigField "String", "OPENAI_API_KEY", "\"${openAiKey}\""
    }

    // Determine if signing properties are available
    def hasReleaseSigning = project.hasProperty('RQ_STORE_FILE') && project.hasProperty('RQ_STORE_PASSWORD') && project.hasProperty('RQ_KEY_ALIAS') && project.hasProperty('RQ_KEY_PASSWORD')

    signingConfigs {
        release {
            // Values are read from gradle.properties; do not commit secrets
            if (hasReleaseSigning) {
                storeFile file(RQ_STORE_FILE)
                storePassword RQ_STORE_PASSWORD
                keyAlias RQ_KEY_ALIAS
                keyPassword RQ_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                // Build unsigned release when keystore is not configured (e.g., CI or local dev)
                // You can sign the generated APK/AAB later using your keystore
            }
        }
    }
    
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.media:media:1.7.0'

    // Hilt (DI)
    implementation 'com.google.dagger:hilt-android:2.52'
    annotationProcessor 'com.google.dagger:hilt-android-compiler:2.52'

    // Room (DB)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // ExoPlayer (Audio)
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'

    // AndroidX Lifecycle ViewModel (Java-friendly)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'

    // Google AI SDK (Gemini)
    implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'

    // OkHttp for WebSocket (real-time API)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Test
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.room:room-testing:2.6.1'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
